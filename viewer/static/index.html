<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>sank-vault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237c5cff'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230a0b0e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css?v=__VER__">
</head>
<body>
<header id="main-header">
  <div class="header-top">
    <span class="logo">sank<b>&middot;vault</b></span>
    <div class="header-actions">
      <span id="count" class="count-badge"></span>
      <button type="button" id="gear" class="icon-btn" title="Status do download" aria-label="Status do download">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button type="button" id="logout" class="icon-btn" title="Sair" aria-label="Sair">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>
  <div class="header-controls">
    <div class="sort-box">
      <button type="button" id="randbtn" title="Ordem aleatória (apresentação)" aria-label="Ordem aleatória" aria-pressed="false">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
          <line x1="4" y1="4" x2="9" y2="9"></line>
        </svg>
      </button>
      <select id="sort" title="Ordenar por" aria-label="Ordenar por"></select>
    </div>
    <div id="tagbar">
      <div id="chips"></div>
      <input id="taginput" type="search" placeholder="filtrar por tags… (Enter adiciona)" autocomplete="off" aria-label="Filtrar por tags">
      <ul id="suggest" hidden></ul>
    </div>
  </div>
</header>

<nav id="tabs">
  <div class="tabs-scroll">
    <button type="button" class="tab active" data-cat="all">Geral <span class="tcount"></span></button>
    <button type="button" class="tab" data-cat="fav">★ Favoritos <span class="tcount"></span></button>
    <button type="button" class="tab" data-cat="image">Imagens <span class="tcount"></span></button>
    <button type="button" class="tab" data-cat="gif">GIFs <span class="tcount"></span></button>
    <button type="button" class="tab" data-cat="video">Vídeos <span class="tcount"></span></button>
  </div>
  <span id="probenote" hidden></span>
</nav>

<main id="grid"></main>
<div id="empty" hidden>Nenhuma mídia encontrada</div>
<div id="sentinel"></div>

<!-- Painel do Downloader (Modal) -->
<div id="dlpanel" hidden>
  <div class="dlcard">
    <div class="dlhead">
      <div class="dlhead-title">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <b>Download dos Favoritos</b>
      </div>
      <button type="button" id="dl-close" class="modal-close" title="Fechar" aria-label="Fechar">&times;</button>
    </div>
    <div id="dl-body"></div>
    <div class="dl-actions">
      <button type="button" id="dl-start" class="btn primary">Baixar Tudo (Full)</button>
      <button type="button" id="dl-sync" class="btn">Sync Rápido</button>
      <button type="button" id="dl-stop" class="btn danger" disabled>Parar</button>
    </div>
    <p id="dl-hint"></p>
  </div>
</div>

<!-- Lightbox Fullscreen Imersivo -->
<div id="lightbox" hidden>
  <div id="lb-topbar">
    <div class="lb-meta">
      <span id="lb-counter"></span>
      <span id="lb-filesize"></span>
    </div>
    <div class="lb-actions">
      <button type="button" id="lb-fav" class="lb-btn" title="Favorito" aria-label="Favoritar">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </button>
      <button type="button" id="lb-close" class="lb-btn" title="Fechar (Esc)" aria-label="Fechar">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div id="lb-content"></div>

  <div id="lb-tags" hidden>
    <div id="lb-title"></div>
    <div id="lb-taglist"></div>
    <div id="lb-tagedit">
      <input id="lb-custom" placeholder="+ tag personalizada (Enter)" autocomplete="off" aria-label="Adicionar tag personalizada">
      <input id="lb-title-input" placeholder="nome da mídia (Enter salva)" autocomplete="off" aria-label="Nome da mídia">
    </div>
  </div>

  <!-- Indicador de aceleração (segurar no vídeo) -->
  <span id="lb-speed" hidden>▶▶ 2×</span>

  <!-- Controles laterais desktop -->
  <button type="button" class="nav" id="lb-prev" title="Anterior (Seta Esquerda)" aria-label="Anterior">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button type="button" class="nav" id="lb-next" title="Próximo (Seta Direita)" aria-label="Próximo">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
</div>

<script src="/static/app.js?v=__VER__"></script>
</body>
</html>
