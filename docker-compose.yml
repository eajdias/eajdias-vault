name: zub-vault

services:
  # Baixa os favoritos do Sankaku. Uso manual:
  #   docker compose run --rm downloader
  # Amostra pequena (teste):
  #   docker compose run --rm -e GDL_EXTRA_ARGS="--range 1-3 --sleep-request 1" downloader
  downloader:
    build: ./downloader
    profiles: ["manual"]
    env_file:
      - path: .env
        required: false
    environment:
      GDL_EXTRA_ARGS: ${GDL_EXTRA_ARGS:-}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:-15} # heartbeat: du+find a cada N s (3s sua IO em vault grande)
    volumes:
      - ${MEDIA_BIND:-vault_media}:/data/media
      - ${DB_BIND:-vault_db}:/data/db
    restart: "no"

  # Web UI local com login: http://127.0.0.1:8090
  # Somente leitura para downloads: o painel da UI (engrenagem) mostra o
  # status via heartbeat; início e parada acontecem pelo terminal ou autosync.
  viewer:
    build: ./viewer
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-Zubvault@123}
      MEDIA_DIR: /data/media
      THUMB_DIR: /data/thumbs
      ADDR: ":8080"
    volumes:
      - ${MEDIA_BIND:-vault_media}:/data/media:ro
      - ${THUMBS_BIND:-vault_thumbs}:/data/thumbs
    restart: unless-stopped

  # Sync incremental diario automatico (04:00 por padrao; mude com
  # AUTOSYNC_HOUR="06:30" no .env). Nao corre junto de um download manual:
  # detecta o heartbeat do painel e reprograma sozinho.
  autosync:
    build: ./downloader
    # sobrescreve o ENTRYPOINT da imagem (entrypoint.sh baixaria na hora!)
    entrypoint: ["/app/autosync.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      AUTOSYNC_HOUR: ${AUTOSYNC_HOUR:-04:00}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:-15} # idem downloader (autosync usa o mesmo entrypoint)
    volumes:
      - ${MEDIA_BIND:-vault_media}:/data/media
      - ${DB_BIND:-vault_db}:/data/db
    restart: unless-stopped

# Layout homelab: repo em <disco>/docker/zub-vault + .env com
#   MEDIA_BIND=<disco>/docker/zub-vault/media
#   THUMBS_BIND=<disco>/docker/zub-vault/thumbs
#   DB_BIND=<disco>/docker/zub-vault/db
# (ver README "Homelab e opacidade"). Sem essas vars, valem os volumes
# nomeados abaixo — comportamento atual, nada muda.
#
# Os `name:` preservam os volumes criados na era `sank-vault` (antes do
# rename): sem eles o compose criaria volumes vazios e o vault "sumiria".
# `external: true`: os volumes têm vida própria — `down -v` nunca os apaga
# (proteção contra dedo nervoso) e o warning de label some. Setup do zero: crie antes
# com `docker volume create sank-vault_vault_media` (+ _db, + _thumbs).
volumes:
  vault_media:   # midias sem extensao (dentro do disco do Docker/WSL2)
    name: sank-vault_vault_media
    external: true
  vault_db:      # archive.sqlite -> deduplicacao entre execucoes
    name: sank-vault_vault_db
    external: true
  vault_thumbs:  # cache de miniaturas do viewer
    name: sank-vault_vault_thumbs
    external: true
